appId: com.aistudio.ricemart.pkqmsx
---
- launchApp

# Wait for app to finish splash screen loading on slow CI emulator
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 15000

# Tap Forgot Password link on Login Form
- tapOn: "Forgot Password?"

- extendedWaitUntil:
    visible: "Reset Password"
    timeout: 10000

- tapOn: "10 digit registered mobile number"
- inputText: "6300028491"
- tapOn: "Send Reset Code"
