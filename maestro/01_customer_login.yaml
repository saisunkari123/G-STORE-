appId: com.aistudio.ricemart.pkqmsx
---
- launchApp

# Wait for app to finish splash screen loading on slow CI emulator
- extendedWaitUntil:
    visible: "10 digit number"
    timeout: 15000

# Type in Phone Number
- tapOn: "10 digit number"
- inputText: "6300028491"

# Type in Password
- tapOn: "••••••••"
- inputText: "Sai@1234"

# Click Login
- tapOn: "Login"

# Verify we reached the Customer Home Screen
- extendedWaitUntil:
    visible: "G-STORE"
    timeout: 15000
