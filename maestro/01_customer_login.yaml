appId: com.aistudio.ricemart.pkqmsx
---
- launchApp

# Wait for Login screen to appear (App opens to Login form by default)
- assertVisible: "10 digit number"

# Type in Phone Number
- tapOn: "10 digit number"
- inputText: "6300028491"

# Type in Password
- tapOn: "••••••••"
- inputText: "Sai@1234"

# Click Login
- tapOn: "Login"

# Verify we reached the Customer Home Screen
- extendedWaitUntil:
    visible: "G-STORE"
    timeout: 10000
